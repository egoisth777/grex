name: CI

on:
  push:
    branches: [master, main, "feat/**"]
  pull_request:
    branches: [master, main, "feat/**"]

jobs:
  build:
    name: build / ${{ matrix.os }} / ${{ matrix.toolchain }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        toolchain: [stable]
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.toolchain }}
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build
        run: cargo build --workspace --all-targets

      - name: Test
        run: cargo test --workspace

  typos:
    name: typos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: crate-ci/typos@master

  cargo-deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          log-level: warn
          command: check

  # Gate 1: Coverage floor.
  # TODO(m5): raise floor back to 80% as M3/M4 add real logic + tests.
  # M2 threshold = 60% (set 5% below current measured coverage to absorb
  # minor churn) — still a meaningful signal while early crates are shells.
  coverage:
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov
      - name: Generate lcov (artifact)
        run: cargo llvm-cov --workspace --lcov --output-path lcov.info
      - name: Generate JSON summary
        # Separate pass: `--lcov --summary-only` does NOT emit a parseable
        # human summary to stdout. Use `report --json` against the existing
        # profile data produced by the previous step.
        run: cargo llvm-cov report --json --summary-only > cov.json
      - name: Enforce >= 60% line coverage
        run: |
          pct=$(jq -r '.data[0].totals.lines.percent' cov.json)
          echo "Line coverage: ${pct}%"
          awk -v p="$pct" 'BEGIN { exit (p+0 >= 60) ? 0 : 1 }'
      - uses: actions/upload-artifact@v7
        with:
          name: lcov
          path: lcov.info

  # Gate 2: Rustdoc warnings as errors.
  rustdoc:
    name: rustdoc
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build docs (warnings as errors)
        run: cargo doc --workspace --no-deps --all-features

  # Gate 3: MSRV guard (Rust 1.75, matches workspace rust-version).
  msrv:
    name: msrv (1.75)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.75"
      - uses: Swatinem/rust-cache@v2
      - name: cargo check on MSRV
        run: cargo check --workspace --all-targets

  # Gate 4: Unused dependency detector.
  machete:
    name: cargo-machete
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: bnjbvr/cargo-machete@main

  # Gate 5: Semver breakage detection.
  # Pre-v0.1.0 this crate is unpublished, so cargo-semver-checks cannot
  # fetch a baseline from crates.io and fails with a registry lookup error.
  # Skip on PRs/pushes until we publish; only run on `release` events where
  # a baseline is guaranteed to exist.
  # TODO(v0.1.0): remove the `if:` guard once first release is published.
  semver-checks:
    name: semver-checks
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
      - uses: Swatinem/rust-cache@v2
      - uses: obi1kenobi/cargo-semver-checks-action@v2
        with:
          release-type: patch

  # Lean4 proof verification — mechanises invariant I1 (no double lock) per
  # `.omne/cfg/concurrency.md` §Lean4 invariant. Linux-only is acceptable
  # per `.omne/cfg/test-plan.md` §Lean4 proof verification — `.olean` is
  # platform-agnostic, so one successful build proves the invariant
  # everywhere.
  #
  # Stage 0.5.F hard gate. `lake build` alone tolerates `sorry` warnings
  # and exits 0; the grep step mechanically enforces Rule 8
  # (`.omne/schemas/rules.md`): "any non-simple algorithm requires Lean4
  # proof to compile clean — zero sorry, zero admit — BEFORE any Rust
  # code change lands". All steps below are gating (no continue-on-error,
  # no conditional `if:`).
  #
  # Job key `lean-proof` is preserved (branch-protection refs intact);
  # only the display `name:` changed.
  lean-proof:
    name: Lean4 proof gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Lean toolchain
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: proof
          # We invoke `lake build` manually below to capture wall-time;
          # tell the action to skip its own build pass.
          build: false
      - name: lake build (with wall-time capture)
        id: lake-build
        working-directory: proof
        shell: bash
        run: |
          start=$(date +%s%N)
          lake build 2>&1 | tee build.log
          rc=${PIPESTATUS[0]}
          end=$(date +%s%N)
          echo "wall_time_ns=$((end - start))" >> "$GITHUB_OUTPUT"
          echo "wall_time_ms=$(( (end - start) / 1000000 ))" >> "$GITHUB_OUTPUT"
          exit "$rc"
      - name: Reject sorry / admit in proof source
        working-directory: proof
        shell: bash
        run: |
          # Strict patterns target proof-body shapes (tactic positions and
          # `:=` RHS), not docstring/comment mentions like
          # `zero \`sorry\` / zero \`admit\``. If a future tactic shape
          # leaks through, tighten here — do NOT relax to whole-word
          # `\bsorry\b` (catches docstrings).
          if grep -rE '^\s*sorry\s*$|:=\s*sorry\b|:=\s*by\s+sorry\b|\bby\s+sorry\b|\bexact\s+sorry\b|^\s*admit\s*$|\bby\s+admit\b|\bexact\s+admit\b' Grex/ Grex.lean; then
            echo "ERROR: sorry or admit found in proof source — Stage 0.5 hard gate violation."
            exit 1
          fi
          echo "OK: zero sorry, zero admit in proof bodies."
      - name: Verify theorem count (>=14)
        working-directory: proof
        shell: bash
        run: |
          # Column-0 anchor: actual `theorem` declarations sit at column 0
          # in this codebase (no namespace nesting). Avoids matching
          # docstring continuations that happen to start with the word
          # "theorem".
          count=$(grep -hE '^theorem\b' Grex.lean Grex/*.lean | wc -l)
          echo "Theorem count: $count"
          if [ "$count" -lt 14 ]; then
            echo "ERROR: expected >=14 theorems (W1-W8 + I1 + no_deadlock + V1 + C1 + C2 + F1), found $count."
            exit 1
          fi
      - name: Verify bridge axiom count (=9)
        working-directory: proof
        shell: bash
        run: |
          # Column-0 anchor: real `axiom` declarations are unindented. An
          # indented `axiom` token inside a /-- ... -/ docstring (e.g.
          # `    axiom is needed because ...`) must NOT count.
          count=$(grep -cE '^axiom\b' Grex/Bridge.lean)
          echo "Bridge axiom count: $count"
          if [ "$count" -ne 9 ]; then
            echo "ERROR: expected exactly 9 bridge axioms in Bridge.lean, found $count."
            echo "Audit Bridge.lean and update CI count if intentional."
            exit 1
          fi
      - name: Snapshot wall-time
        shell: bash
        run: |
          echo "::notice title=Lake build wall-time::${{ steps.lake-build.outputs.wall_time_ms }}ms"

  # Gate: MCP protocol conformance (L6) — external-oracle gate.
  # Runs `mcp-validator` (Janix-ai) against a release build of `grex serve`
  # at protocol `2025-06-18`. See `man/ci/mcp-conformance.md` for pin
  # rationale, bypass procedure, and local repro steps.
  #
  # Self-contained job — owns its own `cargo build --release` so `needs:` is
  # deliberately OMITTED (see `openspec/changes/feat-m7-3-mcp-ci-conformance/proposal.md`
  # §Design Notes). A `needs: [build]` dependency would stall on the
  # 3-OS debug matrix (~5 min p95) with zero artefact payoff. Budget:
  # ~3.5 min cold / ~1.5 min warm.
  #
  # Validator pin: `github.com/egoisth777/mcp-validator@d766d3ee94076b13d0b73253e5221bbc76b9edb2`
  # (fork of Janix-ai/mcp-validator at tag `v0.3.1`, published
  # 2025-07-08T13:55:45Z). We check out an **org-controlled mirror** rather
  # than upstream directly so arbitrary upstream commits (or a compromised /
  # deleted upstream) cannot execute code in CI — the SHA is the same, but
  # the host repo is one we control. See
  # `man/ci/mcp-conformance.md` §"Supply-chain hardening" for rationale.
  #
  # PyPI publication of `mcp-validator==0.3.1` is NOT available (PyPI only
  # lists `0.1.1` as of the 2026-04-22 lookup), so the git+SHA install path
  # is the canonical pin and the only reliable install route. Any bump MUST
  # update the tag AND SHA together — re-run
  # `gh api repos/Janix-ai/mcp-validator/git/refs/tags/v<NEW>` against
  # upstream, then mirror the SHA into `egoisth777/mcp-validator` before
  # bumping the `ref:` below.
  mcp-conformance:
    name: MCP protocol conformance (2025-06-18)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          # Distinct key from the debug `build` job so the release target
          # does not thrash the debug cache.
          key: release
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build release grex (self-contained; ~3 min cold, < 1 min warm)
        run: cargo build --release -p grex-cli
      - name: Check out mcp-validator (org mirror, SHA d766d3e / tag v0.3.1)
        # Checked out from the **org-controlled mirror** `egoisth777/mcp-validator`
        # (a fork of `Janix-ai/mcp-validator` pinned at the same SHA) to
        # close the supply-chain ACE risk of running an external repo's
        # code under CI credentials. Mirror refresh procedure +
        # rationale: `man/ci/mcp-conformance.md` §"Supply-chain hardening".
        #
        # Upstream at tag v0.3.1 ships NEITHER `setup.py` NOR
        # `pyproject.toml`, so `pip install git+URL` is NOT supported —
        # pip refuses with "does not appear to be a Python project".
        # Upstream's own `ref_gh_actions/stdio-validation.yml@v0.3.1`
        # template suggests `pip install git+…` but that is aspirational;
        # the repo at this SHA is checkout-and-run only. We clone the pin,
        # install `requirements.txt`, and put the checkout on `PYTHONPATH`
        # so `python -m mcp_testing.*` resolves. Bump policy: re-check
        # upstream for a pip-installable release before switching to
        # `pip install`.
        uses: actions/checkout@v6
        with:
          repository: egoisth777/mcp-validator
          ref: d766d3ee94076b13d0b73253e5221bbc76b9edb2
          path: .mcp-validator
      - name: Install mcp-validator deps
        run: |
          python -m pip install --upgrade pip
          pip install -r .mcp-validator/requirements.txt
      - name: Run conformance suite (protocol 2025-06-18)
        # Verified CLI at tag v0.3.1 via `--help`:
        #   usage: cli.py [-h] [--args ARGS [ARGS ...]] [--debug]
        #                 [--protocol-version {2024-11-05,2025-03-26,2025-06-18}]
        #                 [--output-dir OUTPUT_DIR]
        #                 [--report-format {text,json,html}]
        #                 server_command
        # Notes:
        #   * `server_command` is POSITIONAL (not `--server-command`).
        #   * There is NO `--timeout` flag at this SHA — upstream's own
        #     `ref_gh_actions/stdio-validation.yml` template lists `--timeout`
        #     but the template drifted from the code at v0.3.1. Omitted here.
        #   * `PYTHONPATH` hop is needed because the upstream repo at this
        #     SHA is not a pip-installable project (no setup.py / pyproject.toml).
        env:
          PYTHONPATH: ${{ github.workspace }}/.mcp-validator
        run: |
          mkdir -p reports
          python -m mcp_testing.stdio.cli \
            "$GITHUB_WORKSPACE/target/release/grex serve" \
            --protocol-version 2025-06-18 \
            --output-dir reports \
            --report-format json
      - name: Upload validator reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mcp-conformance-reports
          path: reports/
          retention-days: 14

  # Gate: Man-page drift (M8-8).
  # Man pages under `man/` are a passive projection of the `clap::Command`
  # tree in `crates/grex/src/cli/args.rs`, generated by `cargo xtask gen-man`.
  # Whenever a contributor touches `args.rs` (adds a verb, changes a flag,
  # rewrites a help string) they must re-run the xtask and commit the
  # updated `.1` files. This job re-generates from source and fails the
  # build if `git diff --exit-code man/` finds any uncommitted delta.
  man-drift:
    name: man-drift (clap_mangen)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Regenerate man pages
        run: cargo run --quiet -p xtask -- gen-man
      - name: Fail on drift vs committed man/
        run: |
          if ! git diff --exit-code -- man/; then
            echo "::error::man/ is out of date. Run 'cargo xtask gen-man' and commit the result."
            exit 1
          fi

  # Gate: cargo-dist manifest sanity (M8-1).
  # Runs `dist plan` on every PR to catch drift in `[workspace.metadata.dist]`
  # before a tag push. No binaries built, no artefacts uploaded — single step.
  # Pinned to the same cargo-dist version as `[workspace.metadata.dist].cargo-dist-version`.
  release-plan:
    name: release-plan (cargo-dist)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v6
      - name: Install cargo-dist (v0.31.0; pinned to workspace.metadata.dist)
        run: curl --proto '=https' --tlsv1.2 -LsSf https://github.com/axodotdev/cargo-dist/releases/download/v0.31.0/cargo-dist-installer.sh | sh
      - name: dist plan
        run: dist plan --output-format=json > /dev/null

  # Housekeeping: cargo-audit (redundant with cargo-deny advisories, kept for standalone signal).
  cargo-audit:
    name: cargo-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: Swatinem/rust-cache@v2
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # Ignores are configured in .cargo/audit.toml (mirrors deny.toml).
          # TODO(m5): drop once gitoxide publishes fixes for those advisories.

  # Gates 8 & 9: CBO per module <= 10 and cyclomatic per fn <= 15.
  # Implemented with rust-code-analysis-cli. Gate 10 (cognitive complexity)
  # is enforced by the clippy job via workspace.lints.clippy.cognitive_complexity = "deny".
  code-metrics:
    name: code-metrics (cbo + cyclomatic)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install rust-code-analysis-cli
        run: cargo install rust-code-analysis-cli --version 0.0.25 --locked || cargo install rust-code-analysis-cli --locked
      - name: Run metrics
        run: |
          mkdir -p metrics-out
          rust-code-analysis-cli --metrics -p crates -O json -o metrics-out
      - name: Enforce CBO <= 10 per module and cyclomatic <= 15 per fn
        run: |
          node - <<'EOF'
          const fs = require('fs'); const path = require('path');
          function walk(d){return fs.readdirSync(d,{withFileTypes:true}).flatMap(e=>{
            const p=path.join(d,e.name);return e.isDirectory()?walk(p):[p];});}
          const files = walk('metrics-out').filter(f=>f.endsWith('.json'));
          const CBO_MAX=10, CYC_MAX=15;
          const violations=[];
          function visit(node, file){
            const m=node.metrics||{};
            const cbo = m.cbo && (m.cbo.cbo ?? m.cbo.coupling);
            if (typeof cbo === 'number' && cbo > CBO_MAX && (node.kind==='unit'||node.kind==='module'))
              violations.push(`CBO ${cbo} > ${CBO_MAX} in ${file}:${node.name}`);
            const cyc = m.cyclomatic && (m.cyclomatic.sum ?? m.cyclomatic.average ?? m.cyclomatic);
            const cycVal = typeof cyc === 'object' ? cyc.sum : cyc;
            if (node.kind==='function' && typeof cycVal === 'number' && cycVal > CYC_MAX)
              violations.push(`Cyclomatic ${cycVal} > ${CYC_MAX} in ${file}:${node.name}`);
            (node.spaces||[]).forEach(s=>visit(s, file));
          }
          for (const f of files){ try { const j=JSON.parse(fs.readFileSync(f,'utf8')); visit(j, f);} catch(e){console.error('parse fail',f,e.message);} }
          if (violations.length){ console.error('Metric violations:\n'+violations.join('\n')); process.exit(1); }
          console.log(`OK: ${files.length} files scanned, no CBO/cyclomatic violations.`);
          EOF
